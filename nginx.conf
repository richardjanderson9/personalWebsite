server {
    # Non-root users cannot use port 80. Match this to EXPOSE 8080 in Dockerfile.
    listen 8080;

    # Define root at the server level so all locations inherit it
    root /usr/share/nginx/html;

    # Enable gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        index index.html;
        # This is critical for React Router to work
        try_files $uri $uri/ /index.html;
    }
    
    # Cache control for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|json|map)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        # Optional: turns off logging for static assets to keep logs clean
        access_log off; 
    }
}